version: 2.1

orbs:
  win: circleci/windows@5.0

# templates/tests are copied into the user's project; only the two files below run standalone from the repo root.
commands:
  git-identity:
    steps:
      - run:
          name: Git identity (some tests create commits)
          command: |
            git config --global user.email "ci@lodemap.invalid"
            git config --global user.name "Lodemap CI"

jobs:
  linux:
    parameters:
      python:
        type: string
    docker:
      - image: cimg/python:<< parameters.python >>
    steps:
      - checkout
      - git-identity
      - run: python -m pip install pytest
      - run:
          name: Tests
          command: python -m pytest -q
      - run:
          name: Standalone template tests
          command: python -m pytest -q templates/tests/test_codegraph_ponte.py templates/tests/test_qualidade.py

  windows:
    executor: win/default
    steps:
      - checkout
      - git-identity
      - run: python -m pip install pytest
      - run:
          name: Tests
          command: python -m pytest -q
      - run:
          name: Standalone template tests
          command: python -m pytest -q templates/tests/test_codegraph_ponte.py templates/tests/test_qualidade.py

  # End to end: the example map (exemplos/axios) regenerated by the real pipeline (Java + Structurizr CLI), then the
  # tests it delivers and the quality gate. LODEMAP_EXIGIR_PIPELINE=1 turns a missing tool into a failure.
  pipeline-linux:
    docker:
      - image: cimg/python:3.12-node
    environment:
      LODEMAP_EXIGIR_PIPELINE: "1"
      LODEMAP_EXEMPLO_AXIOS: /home/circleci/axios
    steps:
      - checkout
      - git-identity
      - run:
          name: Java 21
          command: sudo apt-get update -qq && sudo apt-get install -y -qq openjdk-21-jre-headless unzip
      - run: bash .circleci/preparar_pipeline.sh
      - run: python -m pip install pytest
      - run:
          name: Pipeline on the example map
          command: python -m pytest -q tests/test_exemplo_axios.py

  pipeline-macos:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
    environment:
      LODEMAP_EXIGIR_PIPELINE: "1"
      LODEMAP_EXEMPLO_AXIOS: /Users/distiller/axios
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - checkout
      - git-identity
      - run:
          name: Java 21
          command: |
            brew install --quiet openjdk@21
            echo 'export PATH="$(brew --prefix openjdk@21)/bin:$PATH"' >> "$BASH_ENV"
      - run: bash .circleci/preparar_pipeline.sh
      - run:
          name: Python environment
          command: python3 -m venv ~/venv && ~/venv/bin/pip install -q pytest
      - run:
          name: Pipeline on the example map
          command: ~/venv/bin/python -m pytest -q tests/test_exemplo_axios.py
      - run:
          name: Full suite on macOS
          command: ~/venv/bin/python -m pytest -q

workflows:
  tests:
    jobs:
      - linux:
          matrix:
            parameters:
              python: ["3.11", "3.12"]
      - windows
      - pipeline-linux
      - pipeline-macos
